<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Canine Genetics & Mythic Lineage Tracker</title>
    <!-- PyScript Core -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body {
            background-color: #0b2e13;
            color: #d1e7dd;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #a3cfbb;
            text-shadow: 1px 1px 3px #000;
            margin-bottom: 25px;
        }
        #game-container {
            background-color: #15401d;
            border: 2px solid #285430;
            border-radius: 12px;
            padding: 30px;
            width: 900px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        button {
            background-color: #2b7a3e;
            color: white;
            border: none;
            padding: 10px 16px;
            margin: 5px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #388e4c;
            transform: translateY(-1px);
        }
        pre {
            background-color: #0d2312;
            padding: 18px;
            border-radius: 8px;
            white-space: pre-wrap;
            color: #e2f0d9;
            border: 1px solid #234e30;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            line-height: 1.5;
            max-height: 420px;
            overflow-y: auto;
        }
        .male-tag { color: #6ea8fe; font-weight: bold; }
        .female-tag { color: #f38ba8; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🐾 Canine Genetics & Mythic Lineage Tracker</h1>
    
    <div id="game-container">
        <div id="output">Loading game environment...</div>
        <div id="controls" style="margin-top: 20px;"></div>
    </div>

    <!-- Embedded Python Game Engine -->
    <script type="py">
        import random
        from pyscript import document

        NAME_POOL = [
            "Atlas", "Cleo", "Orion", "Zelda", "Blaze", "Echo", "Zeus", "Athena", 
            "Kona", "Milo", "Scout", "Shadow", "Copper", "Duchess", "Rex", "Luna", 
            "Bandit", "Nova", "Ghost", "Titan", "Freya", "Fenrir", "Apollo", "Ruby"
        ]

        BREEDS = {
            "Chihuahua": {"group": "Toy", "mythic": False},
            "Golden Retriever": {"group": "Sporting", "mythic": False},
            "German Shepherd": {"group": "Herding", "mythic": False},
            "Cwn Annwn (Mythic)": {"group": "Mythic", "mythic": True},
            "Kitsune Spirit Fox-Dog": {"group": "Mythic", "mythic": True}
        }

        TRAININGS = {
            "Obedience Drill": {"stat": "Discipline", "boost": 3, "cost_action": 1},
            "Agility Obstacle Course": {"stat": "Agility", "boost": 4, "cost_action": 1},
            "Weight Pull Conditioning": {"stat": "Strength", "boost": 4, "cost_action": 1},
            "Tracking & Scent Work": {"stat": "Perception", "boost": 4, "cost_action": 1},
            "Guard Dog Tactics": {"stat": "Aggression", "boost": 3, "cost_action": 1},
            "Mythic Attunement": {"stat": "Mythic Resonance", "boost": 5, "cost_action": 2}
        }

        SHOP_ITEMS = {
            "Ethereal Elixir": {"cost": 500, "desc": "Infuses lineage with mythic latent traits."},
            "Ghost-fire Collar": {"cost": 300, "desc": "Unlocks phantom tracking abilities."},
            "Celestite Chew Toy": {"cost": 150, "desc": "Boosts puppy temperament development."}
        }

        class Dog:
            def __init__(self, name, sex, breed, father="Unknown", mother="Unknown", genes=None, is_puppy=False):
                self.name = name
                self.sex = sex
                self.breed = breed if breed in BREEDS else "Mutt"
                self.is_mythic = BREEDS.get(self.breed, {}).get("mythic", False)
                
                self.age_days = 0
                self.age = 0.0
                
                self.health = 100
                self.base_fertility = random.randint(50, 95)
                self.is_in_heat = True if sex == "Female" else False
                self.is_pregnant = False
                self.pregnancy_days = 0
                self.father = father
                self.mother = mother
                
                self.revealed_traits = set()
                self.illness = None

                if genes:
                    self.genes = genes
                else:
                    self.genes = {
                        "A": [random.choice(["A", "a"]), random.choice(["A", "a"])],
                        "S": [random.choice(["S", "s"]), random.choice(["S", "s"])],
                        "D": [random.choice(["H", "h"]), random.choice(["H", "h"])]
                    }

                self.disabilities = self.calculate_disability_from_genes()

                self.stats = {
                    "Agility": random.randint(8, 15) + (5 if "A" in self.genes["A"] and self.genes["A"].count("A") == 2 else 0),
                    "Strength": random.randint(8, 15) + (5 if "S" in self.genes["S"] and self.genes["S"].count("S") == 2 else 0),
                    "Perception": random.randint(8, 15),
                    "Discipline": random.randint(5, 12),
                    "Aggression": random.randint(5, 12),
                    "Mythic Resonance": random.randint(0, 5) if self.is_mythic else 0
                }

        def calculate_disability_from_genes(self):
            if self.genes["D"] == ["h", "h"]:
                return random.choice(["Hip Dysplasia", "Frail Constitution", "Deafness", "Blindness in one eye"])
            elif self.father != "Unknown" and self.mother != "Unknown" and self.father == self.mother:
                return "Severe Inbreeding Depression"
            return None

        @property
        def fertility(self):
            penalty = 0
            if self.age > 6.0:
                penalty = int((self.age - 6.0) * 12)
            elif self.age < 2.0:
                penalty = int((2.0 - self.age) * 15)
            return max(5, self.base_fertility - penalty)

        def get_trait_display(self, trait_name, actual_value):
            if trait_name in self.revealed_traits:
                return str(actual_value)
            return "🔒 Hidden"

        def get_html_summary(self):
            sex_class = "male-tag" if self.sex == "Male" else "female-tag"
            fert_str = self.get_trait_display("fertility", f"{self.fertility}%")
            agi_str = self.get_trait_display("Agility", self.stats['Agility'])
            str_str = self.get_trait_display("Strength", self.stats['Strength'])
            per_str = self.get_trait_display("Perception", self.stats['Perception'])
            disc_str = self.get_trait_display("Discipline", self.stats['Discipline'])
            agg_str = self.get_trait_display("Aggression", self.stats['Aggression'])
            
            heat_str = f" | In Heat: 🔥 Yes" if self.sex == "Female" and self.is_in_heat and self.age >= 2.5 else ""
            preg_str = f"<br>&nbsp;&nbsp;Status: Pregnant ({self.pregnancy_days} days left)" if self.is_pregnant else ""
            
            disab_str = ""
            if self.disabilities and "disability" in self.revealed_traits:
                disab_str = f"<br>&nbsp;&nbsp;⚠️ Disability: {self.disabilities}"

            illness_str = ""
            if self.illness:
                illness_str = f"<br>&nbsp;&nbsp;🦠 Illness: {self.illness} (Health Impacting!)"

            gene_str = ""
            if "genes" in self.revealed_traits:
                gene_str = f"<br>&nbsp;&nbsp;🧬 Genotype (Punnet Loci): A:{self.genes['A']} S:{self.genes['S']} D:{self.genes['D']}"

            mythic_stat_str = ""
            if self.is_mythic:
                myth_str = self.get_trait_display("Mythic Resonance", self.stats['Mythic Resonance'])
                mythic_stat_str = f" | Mythic: {myth_str}"

            stage_label = " (Puppy)" if self.age < 2.5 else ""

            return (f"• <span class='{sex_class}'>{self.name}</span> ({self.sex} - {self.breed}){stage_label}{heat_str}<br>"
                    f"&nbsp;&nbsp;Age: {self.age} yrs | Health: {self.health}% | Fertility: {fert_str}{disab_str}{illness_str}{gene_str}<br>"
                    f"&nbsp;&nbsp;Lineage -> Sire: {self.father} | Dam: {self.mother}<br>"
                    f"&nbsp;&nbsp;Stats -> Agi: {agi_str} | Str: {str_str} | Perc: {per_str} | Disc: {disc_str} | Agg: {agg_str}{mythic_stat_str}{preg_str}<br>")

        game_state = {
            "money": 1500,
            "reputation": 10,
            "day": 1,
            "actions": 3,
            "kennel": {},
            "active_contract": None,
            "selected_males": [],
            "selected_females": [],
            "starters_m": [],
            "starters_f": [],
            "market_dogs": []
        }

        def get_unique_name():
            if NAME_POOL:
                return NAME_POOL.pop(0)
            return f"Dog_{random.randint(100, 999)}"

        def init_setup():
            d_list_m = []
            for _ in range(4):
                dog = Dog(get_unique_name(), "Male", random.choice(list(BREEDS.keys())))
                dog.age_days = 6
                dog.age = 3.0
                d_list_m.append(dog)
            
            d_list_f = []
            for _ in range(4):
                dog = Dog(get_unique_name(), "Female", random.choice(list(BREEDS.keys())))
                dog.age_days = 6
                dog.age = 3.0
                d_list_f.append(dog)

            game_state["starters_m"] = d_list_m
            game_state["starters_f"] = d_list_f
            game_state["selected_males"] = []
            game_state["selected_females"] = []
            show_setup_males()

        def show_setup_males():
            needed = 2 - len(game_state["selected_males"])
            text = f"🐾 FOUNDATION SETUP: Choose your 2 Foundation Sires (Male). Pick {needed} more:"
            if game_state["selected_males"]:
                text += "\nCurrently Selected Males: " + ", ".join([d.name for d in game_state["selected_males"]])
            
            buttons = {}
            for dog in game_state["starters_m"]:
                if dog not in game_state["selected_males"]:
                    desc = f"{dog.name} ({dog.breed})"
                    buttons[desc] = lambda event, d=dog: select_male_starter(d)
            render_plain_ui(text, buttons)

        def select_male_starter(dog):
            if dog not in game_state["selected_males"]:
                game_state["selected_males"].append(dog)
            if len(game_state["selected_males"]) < 2:
                show_setup_males()
            else:
                show_setup_females()

        def show_setup_females():
            needed = 2 - len(game_state["selected_females"])
            text = f"🐾 FOUNDATION SETUP: Sires Selected ({', '.join([d.name for d in game_state['selected_males']])}). Now choose your 2 Foundation Dams (Female). Pick {needed} more:"
            if game_state["selected_females"]:
                text += "\nCurrently Selected Females: " + ", ".join([d.name for d in game_state["selected_females"]])

            buttons = {}
            for dog in game_state["starters_f"]:
                if dog not in game_state["selected_females"]:
                    desc = f"{dog.name} ({dog.breed})"
                    buttons[desc] = lambda event, d=dog: select_female_starter(d)
            render_plain_ui(text, buttons)

        def select_female_starter(dog):
            if dog not in game_state["selected_females"]:
                game_state["selected_females"].append(dog)
            if len(game_state["selected_females"]) < 2:
                show_setup_females()
            else:
                complete_setup()

        def complete_setup():
            for m in game_state["selected_males"]:
                game_state["kennel"][m.name] = m
            for f in game_state["selected_females"]:
                game_state["kennel"][f.name] = f

            refresh_market()
            show_main_menu()

        def refresh_market():
            market_list = []
            for _ in range(3):
                dog = Dog(get_unique_name(), random.choice(["Male", "Female"]), random.choice(list(BREEDS.keys())), father="Market Broker", mother="Market Broker")
                dog.age_days = 6
                dog.age = 3.0
                market_list.append(dog)
            game_state["market_dogs"] = market_list

        def render_plain_ui(text, buttons_dict):
            output_div = document.querySelector("#output")
            controls_div = document.querySelector("#controls")
            output_div.innerHTML = f"<pre>{text}</pre>"
            controls_div.innerHTML = ""
            for label, callback in buttons_dict.items():
                btn = document.createElement("button")
                btn.innerText = label
                btn.onclick = callback
                controls_div.appendChild(btn)

        def render_ui(text, buttons_dict):
            output_div = document.querySelector("#output")
            controls_div = document.querySelector("#controls")
            
            header = f"=== DAY {game_state['day']} ===\nBank Vault: ${game_state['money']} | Rep: {game_state['reputation']} | Actions Left: {game_state['actions']}/3\n\n"
            output_div.innerHTML = f"<pre>{header}{text}</pre>"
            
            controls_div.innerHTML = ""
            for label, callback in buttons_dict.items():
                btn = document.createElement("button")
                btn.innerText = label
                btn.onclick = callback
                controls_div.appendChild(btn)

        def show_main_menu(e=None):
            text = "Choose an action for your kennel:"
            buttons = {
                "View Kennel & Lineage": view_kennel,
                "Buy Dogs (Market)": market_menu,
                "Vet Clinic (Medical & Punnet Diagnostics)": vet_menu,
                "Specialty Shop": shop_menu,
                "Client Contracts": client_menu,
                "Train Dog (Specialized)": train_menu,
                "Breeding & Stud Services": breeding_menu,
                "Explore Zones (-1 Action)": explore_zone,
                "End Day": end_day
            }
            render_ui(text, buttons)

        def view_kennel(e):
            if not game_state["kennel"]:
                text = "Your kennel is empty."
            else:
                text = "🐾 KENNEL REGISTRY & LINEAGE (Fertility drops with age; check genes via Vet):\n\n"
                for dog in game_state["kennel"].values():
                    text += dog.get_html_summary() + "\n"
            render_ui(text, {"Back to Menu": show_main_menu})

        def market_menu(e):
            text = "🛒 ADOPTION & PURCHASE MARKET:\nPurchase new bloodlines to diversify your kennel.\n\n"
            buttons = {}
            for dog in game_state["market_dogs"]:
                cost = 400
                buttons[f"Buy {dog.name} ({dog.sex} {dog.breed}) - ${cost}"] = lambda event, d=dog, c=cost: buy_dog(d, c)
            buttons["Back to Menu"] = show_main_menu
            render_ui(text, buttons)

        def buy_dog(dog, cost):
            if game_state["money"] >= cost:
                game_state["money"] -= cost
                game_state["kennel"][dog.name] = dog
                game_state["market_dogs"].remove(dog)
                render_ui(f"🎉 Successfully purchased {dog.name}!", {"Back to Menu": show_main_menu})
            else:
                render_ui("⚠️ Not enough funds in the bank vault!", {"Back to Menu": show_main_menu})

        def vet_menu(e):
            text = "🏥 VET CLINIC:\nChoose a medical service or Punnet genetic diagnostic:\n"
            buttons = {
                "Reveal Trait / Genotype / Fertility (-$50)": vet_reveal_menu,
                "Treat Illness / Disease (-$100)": vet_treat_illness_menu,
                "Artificial Insemination (-$150)": vet_insemination_menu,
                "Pregnancy Termination (-$100)": vet_abortion_menu,
                "Back to Menu": show_main_menu
            }
            render_ui(text, buttons)

        def vet_reveal_menu(e):
            if game_state["money"] < 50:
                render_ui("⚠️ You need at least $50!", {"Back to Menu": vet_menu})
                return
            buttons = {}
            for name in game_state["kennel"].keys():
                buttons[f"Examine {name}"] = lambda event, n=name: execute_vet_reveal(n)
            buttons["Back"] = vet_menu
            render_ui("Select dog for genetic diagnostics:", buttons)

        def execute_vet_reveal(dog_name):
            dog = game_state["kennel"][dog_name]
            all_traits = ["fertility", "Agility", "Strength", "Perception", "Discipline", "Aggression", "disability", "genes"]
            if dog.is_mythic:
                all_traits.append("Mythic Resonance")
            unrevealed = [t for t in all_traits if t not in dog.revealed_traits]
            if not unrevealed:
                render_ui(f"🩺 All traits/genotypes for {dog.name} are already fully uncovered!", {"Back to Menu": vet_menu})
                return
            game_state["money"] -= 50
            chosen = random.choice(unrevealed)
            dog.revealed_traits.add(chosen)
            
            if chosen == "fertility":
                val = f"{dog.fertility}%"
            elif chosen == "disability":
                val = dog.disabilities if dog.disabilities else "None (Healthy)"
            elif chosen == "genes":
                val = f"A:{dog.genes['A']} S:{dog.genes['S']} D:{dog.genes['D']}"
            else:
                val = str(dog.stats[chosen])
            
            render_ui(f"🩺 Revealed **{chosen}**: {val} for {dog.name}.", {"Back to Menu": vet_menu})

        def vet_treat_illness_menu(e):
            sick_dogs = [name for name, d in game_state["kennel"].items() if d.illness is not None]
            if not sick_dogs or game_state["money"] < 100:
                render_ui("⚠️ Requires $100 and a dog suffering from an active illness.", {"Back to Menu": vet_menu})
                return
            buttons = {}
            for name in sick_dogs:
                buttons[f"Treat {name} (-$100)"] = lambda event, n=name: execute_treat_illness(n)
            buttons["Back"] = vet_menu
            render_ui("Select sick dog for medical treatment:", buttons)

        def execute_treat_illness(dog_name):
            game_state["money"] -= 100
            dog = game_state["kennel"][dog_name]
            cured_illness = dog.illness
            dog.illness = None
            dog.health = min(100, dog.health + 30)
            render_ui(f"🏥 Treatment successful! {dog.name} has recovered from {cured_illness}.", {"Back to Menu": show_main_menu})

        def vet_insemination_menu(e):
            females = [name for name, d in game_state["kennel"].items() if d.sex == "Female" and not d.is_pregnant and d.age >= 2.5]
            males = [name for name, d in game_state["kennel"].items() if d.sex == "Male" and d.age >= 2.5]
            if not females or not males or game_state["money"] < 150:
                render_ui("⚠️ Requires $150, an adult Female (>= 2.5 yrs), and an adult Male sire.", {"Back to Menu": vet_menu})
                return
            buttons = {}
            for f in females:
                buttons[f"Inseminate {f}"] = lambda event, fn=f: select_insem_sire(fn, males)
            buttons["Back"] = vet_menu
            render_ui("Select Female for Artificial Insemination:", buttons)

        def select_insem_sire(mom_name, males):
            buttons = {}
            for m in males:
                buttons[f"Sire: {m}"] = lambda event, d=m, f=mom_name: attempt_breeding(f, d, cost=150, method="Artificial Insemination")
            buttons["Back"] = lambda event: vet_insemination_menu(event)
            render_ui(f"Select Sire for {mom_name}:", buttons)

        def vet_abortion_menu(e):
            pregnant_females = [name for name, d in game_state["kennel"].items() if d.sex == "Female" and d.is_pregnant]
            if not pregnant_females or game_state["money"] < 100:
                render_ui("⚠️ Requires $100 and a currently pregnant female.", {"Back to Menu": vet_menu})
                return
            buttons = {}
            for f in pregnant_females:
                buttons[f"Terminate Pregnancy: {f}"] = lambda event, fn=f: execute_abortion(fn)
            buttons["Back"] = vet_menu
            render_ui("Select pregnant female for termination procedure:", buttons)

        def execute_abortion(mom_name):
            game_state["money"] -= 100
            mom = game_state["kennel"][mom_name]
            mom.is_pregnant = False
            render_ui(f"🏥 Procedure complete. Pregnancy terminated safely for {mom.name}.", {"Back to Menu": show_main_menu})

        def shop_menu(e):
            text = "🔮 MYTHIC & SPECIALTY SHOP:\n"
            buttons = {}
            for item, data in SHOP_ITEMS.items():
                buttons[f"Buy {item} (${data['cost']})"] = lambda event, i=item, cost=data['cost']: buy_shop_item(i, cost)
            buttons["Back to Menu"] = show_main_menu
            render_ui(text, buttons)

        def buy_shop_item(item_name, cost):
            if game_state["money"] >= cost:
                game_state["money"] -= cost
                render_ui(f"🎁 Successfully purchased {item_name}! Check your inventory or apply to dogs.", {"Back to Menu": shop_menu})
            else:
                render_ui("⚠️ Insufficient funds!", {"Back to Menu": shop_menu})

        def client_menu(e):
            contract_text = ""
            if game_state["active_contract"]:
                c = game_state["active_contract"]
                contract_text = f"📋 Active Contract:\nClient wants a {c['breed']} with at least {c['target_stat']} {c['stat_name']}.\nReward: ${c['reward']} + {c['rep']} Rep\n\n"
            else:
                contract_text = "📋 No active contract. Take one below to earn money!\n\n"

            buttons = {}
            if not game_state["active_contract"]:
                target_breed = random.choice(list(BREEDS.keys()))
                stat_options = ["Agility", "Strength", "Perception", "Discipline", "Aggression"]
                if BREEDS[target_breed]["mythic"]:
                    stat_options.append("Mythic Resonance")
                stat_choice = random.choice(stat_options)
                target_val = random.randint(10, 18)
                reward_cash = random.randint(500, 1000)
                reward_rep = random.randint(4, 10)
                buttons["Accept New Contract"] = lambda event: accept_contract(target_breed, stat_choice, target_val, reward_cash, reward_rep)
            
            if game_state["active_contract"] and game_state["kennel"]:
                for name in game_state["kennel"].keys():
                    buttons[f"Deliver {name}"] = lambda event, n=name: fulfill_contract(n)

            buttons["Back to Menu"] = show_main_menu
            render_ui(contract_text + "Select an option:", buttons)

        def accept_contract(breed, stat_name, target_stat, reward, rep):
            game_state["active_contract"] = {"breed": breed, "stat_name": stat_name, "target_stat": target_stat, "reward": reward, "rep": rep}
            render_ui(f"📋 Contract accepted!", {"Back to Menu": show_main_menu})

        def fulfill_contract(dog_name):
            dog = game_state["kennel"][dog_name]
            c = game_state["active_contract"]
            if dog.breed == c["breed"] and dog.stats[c["stat_name"]] >= c["target_stat"]:
                game_state["money"] += c["reward"]
                game_state["reputation"] += c["rep"]
                del game_state["kennel"][dog_name]
                game_state["active_contract"] = None
                render_ui(f"🎉 Contract fulfilled! Earned ${c['reward']} and {c['rep']} Rep.", {"Back to Menu": show_main_menu})
            else:
                render_ui(f"❌ {dog.name} does not meet contract specifications.", {"Back to Menu": show_main_menu})

        def train_menu(e):
            if game_state["actions"] <= 0:
                render_ui("⚠️ No actions left today!", {"Back to Menu": show_main_menu})
                return
            buttons = {}
            for name in game_state["kennel"].keys():
                buttons[f"Train {name}"] = lambda event, n=name: select_training_type(n)
            buttons["Back to Menu"] = show_main_menu
            render_ui("Select dog for specialized training:", buttons)

        def select_training_type(dog_name):
            dog = game_state["kennel"][dog_name]
            buttons = {}
            for t_name, t_data in TRAININGS.items():
                if t_data["stat"] == "Mythic Resonance" and not dog.is_mythic:
                    continue
                buttons[f"{t_name} (+{t_data['boost']} {t_data['stat']})"] = lambda event, d=dog_name, tn=t_name: execute_specialized_training(d, tn)
            buttons["Back"] = train_menu
            render_ui(f"Select training program for {dog_name}:", buttons)

        def execute_specialized_training(dog_name, training_name):
            t_data = TRAININGS[training_name]
            if game_state["actions"] >= t_data["cost_action"]:
                game_state["actions"] -= t_data["cost_action"]
                game_state["kennel"][dog_name].stats[t_data["stat"]] += t_data["boost"]
                render_ui(f"✅ Training complete! {dog_name} gained +{t_data['boost']} {t_data['stat']}.", {"Back to Menu": show_main_menu})
            else:
                render_ui("⚠️ Not enough actions left today!", {"Back to Menu": show_main_menu})

        def breeding_menu(e):
            text = "breeding & stud registry (Dogs must be at least 2.5 years old):\n"
            buttons = {
                "Natural Breeding": natural_breed_menu,
                "Offer Stud Services (Earn Cash)": stud_offer_menu,
                "Back to Menu": show_main_menu
            }
            render_ui(text, buttons)

        def natural_breed_menu(e):
            females = [name for name, d in game_state["kennel"].items() if d.sex == "Female" and not d.is_pregnant and d.is_in_heat and d.age >= 2.5]
            males = [name for name, d in game_state["kennel"].items() if d.sex == "Male" and d.age >= 2.5]
            if not females or not males:
                render_ui("⚠️ Requires an adult Female (>= 2.5 yrs) in Heat and an adult Male (>= 2.5 yrs).", {"Back to Menu": breeding_menu})
                return
            buttons = {}
            for f in females:
                buttons[f"Breed {f}"] = lambda event, fn=f: select_natural_sire(fn, males)
            buttons["Back"] = breeding_menu
            render_ui("Select Adult Female in Heat:", buttons)

        def select_natural_sire(mom_name, males):
            buttons = {}
            for m in males:
                buttons[f"Sire: {m}"] = lambda event, d=m, f=mom_name: attempt_breeding(f, d, cost=0, method="Natural Breeding")
            buttons["Back"] = lambda event: natural_breed_menu(event)
            render_ui(f"Select Adult Sire for {mom_name}:", buttons)

        def punnet_recomb(gene_list_1, gene_list_2):
            allele1 = random.choice(gene_list_1)
            allele2 = random.choice(gene_list_2)
            return [min(allele1, allele2), max(allele1, allele2)] if allele1 != allele2 else [allele1, allele2]

        def attempt_breeding(mom_name, dad_name, cost, method):
            if cost > 0 and game_state["money"] < cost:
                render_ui(f"⚠️ Requires ${cost}!", {"Back to Menu": vet_menu})
                return
            if cost > 0:
                game_state["money"] -= cost

            mom = game_state["kennel"][mom_name]
            dad = game_state["kennel"][dad_name]
            success_roll = random.randint(1, 100)
            
            if success_roll <= mom.fertility:
                mom.is_pregnant = True
                mom.pregnancy_days = 2
                mom.is_in_heat = False
                mom.current_sire = dad_name
                render_ui(f"❤️ {method} successful! {mom.name} successfully conceived via {dad.name} (Fertility: {mom.fertility}%).", {"Back to Menu": show_main_menu})
            else:
                render_ui(f"❌ {method} failed! {mom.name} did not conceive this cycle (Roll: {success_roll} vs Decreasing Fertility {mom.fertility}%).", {"Back to Menu": show_main_menu})

        def stud_offer_menu(e):
            males = [name for name, d in game_state["kennel"].items() if d.sex == "Male" and d.age >= 2.5]
            if not males:
                render_ui("⚠️ No adult male dogs (>= 2.5 yrs) available for stud.", {"Back to Menu": breeding_menu})
                return
            buttons = {}
            for m in males:
                buttons[f"Offer {m} as Stud (-1 Action)"] = lambda event, mn=m: execute_stud_service(mn)
            buttons["Back"] = breeding_menu
            render_ui("Select your adult male to stand at stud for outside breeders:", buttons)

        def execute_stud_service(dog_name):
            if game_state["actions"] > 0:
                game_state["actions"] -= 1
                fee = random.randint(200, 500)
                game_state["money"] += fee
                game_state["reputation"] += 2
                render_ui(f"🌟 Stud service successful! {dog_name} sired external litters, earning ${fee} and +2 Reputation.", {"Back to Menu": show_main_menu})
            else:
                render_ui("⚠️ No actions left today!", {"Back to Menu": show_main_menu})

        def explore_zone(e):
            if game_state["actions"] <= 0:
                render_ui("⚠️ No actions left today!", {"Back to Menu": show_main_menu})
                return
            game_state["actions"] -= 1
            new_dog = Dog(get_unique_name(), random.choice(["Male", "Female"]), random.choice(list(BREEDS.keys())), father="Wild", mother="Wild")
            new_dog.age_days = 6
            new_dog.age = 3.0
            game_state["kennel"][new_dog.name] = new_dog
            render_ui(f"🎉 Expedition successful! Rescued a wild adult {new_dog.breed} named {new_dog.name}!", {"Back to Menu": show_main_menu})

        def end_day(e):
            game_state["day"] += 1
            game_state["actions"] = 3
            refresh_market()
            log = f"🌙 Advanced to Day {game_state['day']}. Actions refreshed & market updated.\n"
            
            dogs_to_remove = []
            new_puppies = []
            
            for name, dog in list(game_state["kennel"].items()):
                dog.age_days += 1
                dog.age = dog.age_days * 0.5
                
                if dog.illness:
                    dog.health -= 25
                    if dog.health <= 0:
                        dogs_to_remove.append(name)
                        log += f"\n💀 TRAGEDY: {dog.name} has succumbed to their illness ({dog.illness}) and passed away."
                        continue
                else:
                    if random.randint(1, 100) <= 5:
                        dog.illness = random.choice(["Parvovirus", "Kennel Cough", "Canine Distemper", "Severe Bacterial Infection"])
                        log += f"\n🦠 OUTBREAK: {dog.name} has contracted {dog.illness}!"

                if dog.sex == "Female":
                    if not dog.is_pregnant:
                        if dog.age >= 2.5:
                            dog.is_in_heat = not dog.is_in_heat
                    else:
                        dog.pregnancy_days -= 1
                        
                        miscarriage_roll = random.randint(1, 100)
                        if miscarriage_roll <= 10:
                            dog.is_pregnant = False
                            log += f"\n⚠️ TRAGEDY: {dog.name} suffered a spontaneous miscarriage due to health complications!"
                        elif dog.pregnancy_days <= 0:
                            dog.is_pregnant = False
                            sire_name = getattr(dog, "current_sire", "Kennel Sire")
                            sire_obj = game_state["kennel"].get(sire_name, None)
                            
                            if sire_obj:
                                child_genes = {
                                    "A": punnet_recomb(sire_obj.genes["A"], dog.genes["A"]),
                                    "S": punnet_recomb(sire_obj.genes["S"], dog.genes["S"]),
                                    "D": punnet_recomb(sire_obj.genes["D"], dog.genes["D"])
                                }
                            else:
                                child_genes = None

                            pup_name = get_unique_name()
                            pup = Dog(pup_name, random.choice(["Male", "Female"]), dog.breed, father=sire_name, mother=dog.name, genes=child_genes, is_puppy=True)
                            
                            if pup.disabilities and random.randint(1, 100) <= 50:
                                log += f"\n💀 Genetic Tragedy: A puppy from {dog.name}'s litter was stillborn or failed to thrive due to genetic defects ({pup.disabilities})."
                            else:
                                new_puppies.append(pup)
                                log += f"\n🐶 LITTER BORN! Puppy arrived: {pup.name} ({pup.breed}) with Punnet gene recombination!"
            
            for name in dogs_to_remove:
                if name in game_state["kennel"]:
                    del game_state["kennel"][name]
            
            for pup in new_puppies:
                game_state["kennel"][pup.name] = pup

            render_ui(log, {"Back to Menu": show_main_menu})

        # Kick off startup wizard
        init_setup()
    </script>
